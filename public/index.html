    // --- Compact Universal Icon Component ----
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const svgs = {

        Receipt: <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z M16 8H8 M16 12H8 M13 16H8"/>,

    // --- MAIN APPLICATION CONTAINER ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [resetConfirm, setResetConfirm] = useState(false);
      const [currentTimeStr, setCurrentTimeStr] = useState('20:52:54');

      // Sync clock relative to real hour
      useEffect(() => {
        const interval = setInterval(() => {
          const now = new Date();
          setCurrentTimeStr(now.toLocaleTimeString('pt-BR'));
        }, 1000);
        return () => clearInterval(interval);
      }, []);

      // Core cached state hooks
      const [clientes, setClientes] = useState(() => {
        const cached = localStorage.getItem('estetica_clientes');
        return cached ? JSON.parse(cached) : INITIAL_CLIENTES;
      });

      const [servicos, setServicos] = useState(() => {
        const cached = localStorage.getItem('estetica_servicos');
        return cached ? JSON.parse(cached) : INITIAL_SERVICOS;
      });

      const [profissionais, setProfissionais] = useState(() => {
        const cached = localStorage.getItem('estetica_profissionais');
        return cached ? JSON.parse(cached) : INITIAL_PROFISSIONAIS;
      });

      const [agendamentos, setAgendamentos] = useState(() => {
        const cached = localStorage.getItem('estetica_agendamentos');
        return cached ? JSON.parse(cached) : INITIAL_AGENDAMENTOS;
      });

      const [transacoes, setTransacoes] = useState(() => {
        const cached = localStorage.getItem('estetica_transacoes');
        return cached ? JSON.parse(cached) : INITIAL_TRANSACAES;
      });

      const saveState = (c, s, p, a, t) => {
        localStorage.setItem('estetica_clientes', JSON.stringify(c));
        localStorage.setItem('estetica_servicos', JSON.stringify(s));
        localStorage.setItem('estetica_profissionais', JSON.stringify(p));
        localStorage.setItem('estetica_agendamentos', JSON.stringify(a));
        localStorage.setItem('estetica_transacoes', JSON.stringify(t));
      };

      const makeId = () => Math.random().toString(36).substring(2, 9);

      // Sincronização Síncrona Dupla de Caixa (Checkout de Atendimento + Comissão)
      const handleCheckoutAgendamento = (id, formaPag) => {
        const original = agendamentos.find(a => a.id === id);
        if (!original) return;

        const updatedAgendamentos = agendamentos.map(a => {
          if (a.id === id) return { ...a, status: 'Realizado e Pago' };
          return a;
        });

        const targetClient = clientes.find(c => c.id === original.clienteId)?.nome || 'Cliente';
        const targetService = servicos.find(s => s.id === original.servicoId)?.nome || 'Serviço';
        const targetProf = profissionais.find(p => p.id === original.profissionalId);

        const updatedTransacoes = [...transacoes];

        // 1. Entrada / Faturamento de Caixa
        const entryId = 't-' + makeId();
        const newEntrada = {
          id: entryId,
          tipo: 'Entrada',
          valor: original.valorCobrado,
          data: original.data,
          categoria: 'Serviço',
          descricao: `Atendimento de ${targetClient}: ${targetService}`,
          formaPagamento: formaPag,
          agendamentoId: id
        };
        updatedTransacoes.push(newEntrada);

        // 2. Saída / Repasse de Comissão ao especialista parceiro correspondente
        if (targetProf) {
          const comValue = original.valorCobrado * (targetProf.comissaoPercentual / 100);
          const commissionId = 't-' + makeId();
          const newSaida = {
            id: commissionId,
            tipo: 'Saida',
            valor: comValue,
            data: original.data,
            categoria: 'Comissão',
            descricao: `Comissão ${targetProf.nome} ref. atendimento de ${targetClient}`,
            agendamentoId: id
          };
          updatedTransacoes.push(newSaida);
        }

        setAgendamentos(updatedAgendamentos);
        setTransacoes(updatedTransacoes);
        saveState(clientes, servicos, profissionais, updatedAgendamentos, updatedTransacoes);
      };

      const handleAddAgendamento = (newA) => {
        const agID = 'a-' + makeId();
        const resolvedA = { ...newA, id: agID };

        const updatedAgendamentos = [...agendamentos, resolvedA];
        let updatedTransacoes = [...transacoes];

        if (newA.status === 'Realizado e Pago') {
          const targetClient = clientes.find(c => c.id === newA.clienteId)?.nome || 'Cliente';
          const targetService = servicos.find(s => s.id === newA.servicoId)?.nome || 'Serviço';
          const targetProf = profissionais.find(p => p.id === newA.profissionalId);

          const newEntrada = {
            id: 't-' + makeId(),
            tipo: 'Entrada',
            valor: newA.valorCobrado,
            data: newA.data,
            categoria: 'Serviço',
            descricao: `Atendimento de ${targetClient}: ${targetService}`,
            formaPagamento: 'Pix',
            agendamentoId: agID
          };
          updatedTransacoes.push(newEntrada);

          if (targetProf) {
            const comValue = newA.valorCobrado * (targetProf.comissaoPercentual / 100);
            const newSaida = {
              id: 't-' + makeId(),
              tipo: 'Saida',
              valor: comValue,
              data: newA.data,
              categoria: 'Comissão',
              descricao: `Comissão ${targetProf.nome} ref. atendimento de ${targetClient}`,
              agendamentoId: agID
            };
            updatedTransacoes.push(newSaida);
          }
        }

        setAgendamentos(updatedAgendamentos);
        setTransacoes(updatedTransacoes);
        saveState(clientes, servicos, profissionais, updatedAgendamentos, updatedTransacoes);
      };

      const handleCancelAgendamento = (id) => {
        const updated = agendamentos.map(a => {
          if (a.id === id) return { ...a, status: 'Cancelado' };
          return a;
        });
        setAgendamentos(updated);
        saveState(clientes, servicos, profissionais, updated, transacoes);
      };

      const handleDeleteAgendamento = (id) => {
        const updatedAg = agendamentos.filter(a => a.id !== id);
        const updatedTr = transacoes.filter(t => t.agendamentoId !== id);
        setAgendamentos(updatedAg);
        setTransacoes(updatedTr);
        saveState(clientes, servicos, profissionais, updatedAg, updatedTr);
      };

      const handleAddManualTransacao = (tipo, valor, categoria, descricao, formaPag) => {
        const newTx = {
          id: 't-man-' + makeId(),
          tipo,
          valor,
          data: '2026-05-21',
          categoria,
          descricao,
          formaPagamento: formaPag || undefined
        };
        const updated = [...transacoes, newTx];
        setTransacoes(updated);
        saveState(clientes, servicos, profissionais, agendamentos, updated);
      };

      const handleDeleteTransacao = (id) => {
        const updated = transacoes.filter(t => t.id !== id);
        setTransacoes(updated);
        saveState(clientes, servicos, profissionais, agendamentos, updated);
      };

      const handleAddCliente = (newC) => {
        const freshC = { ...newC, id: 'c-' + makeId(), dataCadastro: '2026-05-21' };
        const updated = [...clientes, freshC];
        setClientes(updated);
        saveState(updated, servicos, profissionais, agendamentos, transacoes);
      };

      const handleAddServico = (newS) => {
        const freshS = { ...newS, id: 's-' + makeId() };
        const updated = [...servicos, freshS];
        setServicos(updated);
        saveState(clientes, updated, profissionais, agendamentos, transacoes);
      };

      const handleAddProfissional = (newP) => {
        const freshP = { ...newP, id: 'p-' + makeId() };
        const updated = [...profissionais, freshP];
        setProfissionais(updated);
        saveState(clientes, servicos, updated, agendamentos, transacoes);
      };

      const handleDeleteCliente = (id) => {
        const updated = clientes.filter(c => c.id !== id);
        setClientes(updated);
        saveState(updated, servicos, profissionais, agendamentos, transacoes);
      };

      const handleDeleteServico = (id) => {
        const updated = servicos.filter(s => s.id !== id);
        setServicos(updated);
        saveState(clientes, updated, profissionais, agendamentos, transacoes);
      };

      const handleDeleteProfissional = (id) => {
        const updated = profissionais.filter(p => p.id !== id);
        setProfissionais(updated);
        saveState(clientes, servicos, updated, agendamentos, transacoes);
      };

      const handleResetData = () => {
        setClientes(INITIAL_CLIENTES);
        setServicos(INITIAL_SERVICOS);
        setProfissionais(INITIAL_PROFISSIONAIS);
        setAgendamentos(INITIAL_AGENDAMENTOS);
        setTransacoes(INITIAL_TRANSACAES);
        saveState(INITIAL_CLIENTES, INITIAL_SERVICOS, INITIAL_PROFISSIONAIS, INITIAL_AGENDAMENTOS, INITIAL_TRANSACAES);
        setResetConfirm(false);
      };

      return (
        <div className="min-h-screen py-6 px-4 md:px-8 bg-slate-50 text-slate-800 font-sans">
          {/* Header */}
          <div className="w-full max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200/60 pb-5 mb-6">
            <div className="flex items-center gap-3">
              <span className="p-2.5 bg-indigo-600 rounded-xl text-white shadow-md">
                <Icon name="Sparkles" className="w-6 h-6 animate-pulse" />

                    <Icon name="UserPlus" className="w-5 h-5" /> Inserir Cliente
                  </button>
                  <button onClick={() => setActiveTab('financeiro')} className="p-3 bg-rose-50 border border-rose-100/50 hover:bg-rose-100/60 rounded-xl text-center text-rose-700 font-bold text-xs flex flex-col items-center justify-center gap-2 transition">
                    <Icon name="ArrowDownRight" className="w-5 h-5" /> Lançar Saída

                  <button onClick={() => setActiveTab('financeiro')} className="p-3 bg-emerald-50 border border-emerald-100/50 hover:bg-emerald-100/60 rounded-xl text-center text-emerald-700 font-bold text-xs flex flex-col items-center justify-center gap-2 transition">
                    <Icon name="ShoppingCart" className="w-5 h-5" /> Vender Cosmético

                </div>
              </div>

              {/* Progress categories */}
              <div className="p-5 bg-white rounded-2xl border border-slate-100 shadow-xs space-y-4">
                <h2 className="text-xs font-black text-slate-800 uppercase tracking-wider">Divisão Orçamentária por Canal</h2>
                <div className="space-y-3.5">
                  <div>
                    <div className="flex justify-between text-xs font-semibold mb-1">
                      <span className="text-slate-500">Atendimentos Clínicos (Entrada)</span>
                      <span className="text-slate-900 font-bold">R$ {servicosSum.toFixed(2)} ({Math.round(percServ)}%)</span>

                      <div className="bg-indigo-600 h-2" style={{ width: `${percServ}%` }}></div>

                      <span className="text-slate-900 font-bold">R$ {prodSum.toFixed(2)} ({Math.round(percProd)}%)</span>

                    <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                      <div className="bg-emerald-500 h-2" style={{ width: `${percProd}%` }}></div>

                    <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">

                    {agHoje.map(a => {
                      const c = clientes.find(item => item.id === a.clienteId);

    // --- SUBVIEW 2: AGENDA TAB ----
    function AgendaTab({ clientes, servicos, profissionais, agendamentos, onAddAgendamento, onCheckoutAgendamento, onCancelAgendamento, onDeleteAgendamento }) {
      const [filterDate, setFilterDate] = useState('2026-05-21');
      const [search, setSearch] = useState('');
      const [showForm, setShowForm] = useState(false);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [errorMsg, setErrorMsg] = useState(null);

      // Form local state
      const [formCl, setFormCl] = useState('');
      const [formSrv, setFormSrv] = useState('');
      const [formProf, setFormProf] = useState('');
      const [formVal, setFormVal] = useState('');
      const [formTime, setFormTime] = useState('');
      const [formStatus, setFormStatus] = useState('Pendente');

      const handleServiceSelect = (id) => {
        setFormSrv(id);
        const price = servicos.find(s => s.id === id)?.preco;
        if (price) setFormVal(price.toString());
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setErrorMsg(null);
        if (!formCl || !formSrv || !formProf || !formTime || !formVal) {
          setErrorMsg('Preencha os campos obrigatórios!');
          return;
        }

        onAddAgendamento({
          clienteId: formCl,
          servicoId: formSrv,
          profissionalId: formProf,
          data: filterDate,
          hora: formTime,
          valorCobrado: parseFloat(formVal),
          status: formStatus
        });

        // clear
        setFormCl('');
        setFormSrv('');
        setFormProf('');
        setFormVal('');
        setFormTime('');
        setFormStatus('Pendente');
        setShowForm(false);
      };

      const filtered = agendamentos.filter(a => {
        const matchesDate = a.data === filterDate;
        const c = clientes.find(item => item.id === a.clienteId)?.nome || '';
        const s = servicos.find(item => item.id === a.servicoId)?.nome || '';
        const matchesSearch = c.toLowerCase().includes(search.toLowerCase()) || s.toLowerCase().includes(search.toLowerCase());
        return matchesDate && matchesSearch;
      });

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
          <div className="lg:col-span-8 space-y-4">
            <div className="p-5 bg-white rounded-2xl border border-slate-100 shadow-xs">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-5">
                <div>
                  <h2 className="text-sm font-black text-slate-800 uppercase">Consultas Agendadas</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Listagem por data selecionada</p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <input type="date" value={filterDate} onChange={(e) => setFilterDate(e.target.value)} className="p-2 border border-slate-200 rounded-xl text-xs font-semibold focus:outline-indigo-600 bg-slate-50"/>
                  <button onClick={() => setShowForm(!showForm)} className="p-2 px-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-extrabold flex items-center gap-1 border border-indigo-600 shadow-xs transition">
                    <Icon name="Plus" /> Lançar Atendimento
                  </button>
                </div>
              </div>

              <div className="relative mb-4">
                <span className="absolute left-3 top-2.5 text-slate-400"><Icon name="Search" /></span>
                <input type="text" placeholder="Filtrar por nome do cliente ou serviço..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full pl-9 p-2 text-xs border border-slate-200 rounded-xl focus:outline-indigo-600" />
              </div>

              {filtered.length === 0 ? (
                <div className="p-8 text-center text-slate-400 text-xs">A recepção não identificou atendimentos nesta data.</div>
              ) : (
                <div className="space-y-3.5">
                  {filtered.map(a => {
                    const c = clientes.find(i => i.id === a.clienteId);
                    const s = servicos.find(i => i.id === a.servicoId);
                    const p = profissionais.find(i => i.id === a.profissionalId);

                    return (
                      <div key={a.id} className="p-3.5 border border-slate-100 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs bg-slate-50/50 hover:bg-slate-50 transition">
                        <div className="space-y-1">
                          <div className="flex items-center gap-2">
                            <span className="font-mono bg-indigo-50 border border-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded text-[10px] font-black">{a.hora}</span>
                            <span className="font-bold text-slate-800">{c ? c.nome : 'Cliente'}</span>
                          </div>
                          <div className="text-slate-500 font-medium">Procedimento: <span className="text-slate-800 font-semibold">{s ? s.nome : 'Serviço'}</span> • Atendedora: <span className="text-slate-800 font-semibold">{p ? p.nome : 'Profissional'}</span></div>
                          <div className="font-black text-slate-700 font-mono">Cobrado: R$ {a.valorCobrado.toFixed(2)}</div>
                        </div>

                        <div className="flex items-center gap-2 md:self-center">
                          {a.status === 'Realizado e Pago' ? (
                            <span className="px-2.5 py-1 text-[10px] rounded-xl bg-emerald-50 text-emerald-800 font-extrabold border border-emerald-200">Realizado e Pago</span>
                          ) : a.status === 'Cancelado' ? (
                            <span className="px-2.5 py-1 text-[10px] rounded-xl bg-slate-100 text-slate-400 font-extrabold">Cancelado</span>
                          ) : (
                            <div className="flex items-center gap-1.5 bg-amber-50 p-1 rounded-xl border border-amber-200 text-[10px]">
                              <span className="font-bold text-amber-700 px-1">Pendente</span>
                              <button onClick={() => onCheckoutAgendamento(a.id, 'Pix')} className="px-2 py-0.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded text-[9px] font-bold transition">Pix</button>
                              <button onClick={() => onCheckoutAgendamento(a.id, 'Dinheiro')} className="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[9px] font-bold transition">Cash</button>
                              <button onClick={() => onCancelAgendamento(a.id)} className="px-1.5 py-0.5 bg-slate-200 hover:bg-slate-300 text-slate-600 rounded text-[9px] font-medium transition font-bold">Cancelar</button>
                            </div>
                          )}

                          {/* Deletion confirer inline explicitly solving iframe restriction of alert/confirm dialog */}
                          {deleteConfirmId === a.id ? (
                            <div className="flex items-center gap-1 bg-rose-50 border border-rose-200 px-2 py-0.5 rounded-xl text-[10px]">

    // --- SUBVIEW 3: FINANCIAL CAIXA TAB ---
    function FinanceiroTab({ transacoes, onAddManualTransacao, onDeleteTransacao }) {
      const [filterTipo, setFilterTipo] = useState('Todos');
      const [filterCat, setFilterCat] = useState('Todos');
      const [showForm, setShowForm] = useState(null);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [errorMsg, setErrorMsg] = useState(null);

      // Form local state
      const [formVal, setFormVal] = useState('');
      const [formDesc, setFormDesc] = useState('');
      const [formCat, setFormCat] = useState('');
      const [formPag, setFormPag] = useState('Pix');

      const handleAddManualSubmit = (e) => {
        e.preventDefault();
        setErrorMsg(null);
        const val = parseFloat(formVal);
        if (isNaN(val) || val <= 0) {
          setErrorMsg('O valor informado precisa ser maior que zero.');
          return;
        }
        if (!formDesc) {
          setErrorMsg('Adicione uma breve descrição para controle.');
          return;
        }
        if (!formCat) {
          setErrorMsg('Designe uma categoria válida.');
          return;
        }

        onAddManualTransacao(showForm, val, formCat, formDesc, showForm === 'Entrada' ? formPag : undefined);
        setFormVal('');
        setFormDesc('');
        setFormCat('');
        setShowForm(null);
      };

      const categoriesList = ['Todos', 'Serviço', 'Venda de Produto', 'Aluguel', 'Luz', 'Insumos', 'Comissão', 'Outros'];

      const filtered = transacoes.filter(t => {
        const matchesTipo = filterTipo === 'Todos' || t.tipo === filterTipo;
        const matchesCat = filterCat === 'Todos' || t.categoria === filterCat;
        return matchesTipo && matchesCat;
      });

      const totalIn = useMemo(() => transacoes.filter(t => t.tipo === 'Entrada').reduce((a, t) => a + t.valor, 0), [transacoes]);
      const totalOut = useMemo(() => transacoes.filter(t => t.tipo === 'Saida').reduce((a, t) => a + t.valor, 0), [transacoes]);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 text-xs">
          <div className="lg:col-span-8 space-y-4">
            <div className="p-5 bg-white rounded-2xl border border-slate-100 shadow-xs">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                <div>
                  <h2 className="text-sm font-black text-slate-800 uppercase">Livro de Fluxo de Caixa</h2>
                  <p className="text-xs text-slate-400 mt-0.5">Conciliação de faturamentos e custos diários</p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <select value={filterTipo} onChange={(e) => setFilterTipo(e.target.value)} className="p-2 border border-slate-200 rounded-xl text-xs font-bold focus:outline-indigo-600 bg-slate-50">
                    <option value="Todos">Todos Fluxos (E/S)</option>
                    <option value="Entrada">Entradas (+)</option>
                    <option value="Saida">Saídas (-)</option>
                  </select>

                  <select value={filterCat} onChange={(e) => setFilterCat(e.target.value)} className="p-2 border border-slate-200 rounded-xl text-xs font-bold focus:outline-indigo-600 bg-slate-50">
                    {categoriesList.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
              </div>

              {filtered.length === 0 ? (
                <div className="p-8 text-center text-slate-400">Nenhum registro contábil localizado com o filtro inserido.</div>
              ) : (
                <div className="space-y-3.5">
                  {filtered.map(t => (
                    <div key={t.id} className="p-3 border border-slate-100 rounded-xl flex items-center justify-between gap-3 text-xs bg-slate-50/50 hover:bg-slate-50 transition">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2 flex-wrap">
                          <span className={`px-2 py-0.5 font-bold rounded-xl text-[9px] ${t.tipo === 'Entrada' ? 'bg-emerald-50 text-emerald-800 border-emerald-100' : 'bg-rose-50 text-rose-800 border-rose-100'} border`}>{t.tipo}</span>
                          <span className="font-mono text-slate-400 text-[10px]">{t.data}</span>
                          <span className="font-bold text-slate-800 bg-slate-100 px-1.5 py-0.5 rounded text-[10px]">{t.categoria}</span>
                        </div>
                        <p className="text-slate-600 font-medium">{t.descricao} {t.formaPagamento && <span className="text-[10px] text-slate-400 font-bold">• {t.formaPagamento}</span>}</p>
                      </div>

                      <div className="flex items-center gap-2 shrink-0">
                        <span className={`font-mono font-bold text-sm ${t.tipo === 'Entrada' ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {t.tipo === 'Entrada' ? '+' : '-'} R$ {t.valor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                        </span>

                        {deleteConfirmId === t.id ? (
                          <div className="flex items-center gap-1 bg-amber-50 rounded-xl border border-amber-200 px-2 py-1 text-[10px]">
                            <span className="font-bold text-amber-800">Deseja apagar?</span>
                            <button onClick={() => { onDeleteTransacao(t.id); setDeleteConfirmId(null); }} className="px-1.5 py-0.5 bg-rose-600 text-white rounded text-[9px] font-bold">Sim</button>
                            <button onClick={() => setDeleteConfirmId(null)} className="px-1.5 py-0.5 bg-slate-200 text-slate-500 rounded text-[9px] font-bold">Não</button>
                          </div>
                        ) : (
                          <button onClick={() => setDeleteConfirmId(t.id)} className="p-1 px-1.5 text-slate-300 hover:text-rose-500 rounded hover:bg-slate-50 transition" title="Excluir"><Icon name="Trash" /></button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="lg:col-span-4 space-y-4">
            <div className="p-4 bg-white rounded-2xl border border-slate-100 shadow-xs flex justify-between gap-2.5">
              <button onClick={() => { setShowForm('Entrada'); setFormCat('Venda de Produto'); setErrorMsg(null); }} className={`flex-1 py-2 font-black rounded-xl text-center border cursor-pointer transition ${showForm === 'Entrada' ? 'bg-emerald-600 border-emerald-600 text-white shadow-md' : 'bg-emerald-50/50 border-emerald-100 text-emerald-800 hover:bg-emerald-100'}`}>+ Entrada</button>
              <button onClick={() => { setShowForm('Saida'); setFormCat('Insumos'); setErrorMsg(null); }} className={`flex-1 py-2 font-black rounded-xl text-center border cursor-pointer transition ${showForm === 'Saida' ? 'bg-rose-600 border-rose-600 text-white shadow-md' : 'bg-rose-50/50 border-rose-100 text-rose-800 hover:bg-rose-100'}`}>- Saída</button>
            </div>

            {showForm && (
              <form onSubmit={handleAddManualSubmit} className="p-5 bg-white rounded-2xl border border-slate-100 shadow-xs space-y-3.5 animate-fade-in text-xs font-sans">
                <div className="flex justify-between items-center pb-2 border-b border-rose-100">
                  <span className="font-black text-slate-700 uppercase">Lançar {showForm} Manual</span>
                  <button type="button" onClick={() => setShowForm(null)} className="text-slate-400 p-1 hover:bg-slate-100 rounded-lg"><Icon name="X" /></button>
                </div>

                {errorMsg && (
                  <div className="p-2 bg-rose-5 border border-rose-100 text-rose-700 font-bold rounded-lg">{errorMsg}</div>
                )}

                <div className="space-y-1">
                  <label className="block text-slate-600 font-bold">Valor Monetário (R$)*</label>
                  <input type="number" step="0.01" value={formVal} onChange={(e) => setFormVal(e.target.value)} className="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 focus:outline-indigo-600" />
                </div>

                <div className="space-y-1">
                  <label className="block text-slate-600 font-bold">Categoria de Lançamento*</label>
                  <select value={formCat} onChange={(e) => setFormCat(e.target.value)} className="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 focus:outline-indigo-600">
                    {showForm === 'Entrada' ? (
                      <>
                        <option value="Venda de Produto">Venda de Produto Cosmético</option>
                        <option value="Serviço">Faturamento de Estética Especial</option>
                        <option value="Outros">Outras Entradas</option>
                      </>
                    ) : (
                      <>
                        <option value="Aluguel">Aluguel Comercial Recorrente</option>
                        <option value="Luz">Luz / Conta de Energia Elétrica</option>
                        <option value="Insumos">Insumos (Algodão, Descartáveis, Ceras)</option>
                        <option value="Comissão">Parceira Reforço Comissão</option>
                        <option value="Outros">Outras Despesas</option>
                      </>
                    )}
                  </select>
                </div>

                <div className="space-y-1">
                  <label className="block text-slate-600 font-bold">Histórico / Descricação do Lançamento*</label>
                  <input type="text" placeholder="Histórico breve descritivo..." value={formDesc} onChange={(e) => setFormDesc(e.target.value)} className="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 focus:outline-indigo-600" />
                </div>

                {showForm === 'Entrada' && (
                  <div className="space-y-1">
                    <label className="block text-slate-600 font-bold">Meio de Recebimento</label>
                    <select value={formPag} onChange={(e) => setFormPag(e.target.value)} className="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 focus:outline-indigo-600">
                      <option value="Pix">Pix Instantâneo</option>
                      <option value="Dinheiro">Dinheiro vivo</option>
                      <option value="Cartão de Débito">Cartão de Débito (Maquininha)</option>
                      <option value="Cartão de Crédito">Cartão de Crédito</option>
                    </select>
                  </div>
                )}

                <button type="submit" className={`w-full py-2 text-white rounded-xl text-center font-extrabold flex justify-center items-center gap-1 transition ${showForm === 'Entrada' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'}`}>
                  <Icon name="Check" /> Consolidar em Caixa
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // --- SUBVIEW 4: CATALOG DESIGN GENERALS ---
    function CadastroTab({ clientes, servicos, profissionais, agendamentos, onAddCliente, onAddServico, onAddProfissional, onDeleteCliente, onDeleteServico, onDeleteProfissional }) {
      const [localTab, setLocalTab] = useState('cli');
      const [clinId, setClinId] = useState(null); // Timeline view client ID
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);

      // Cli form
      const [cliNome, setCliNome] = useState('');
      const [cliTel, setCliTel] = useState('');
      const [cliMail, setCliMail] = useState('');
      const [cliObs, setCliObs] = useState('');

      // Srv form
      const [srvNome, setSrvNome] = useState('');
      const [srvDesc, setSrvDesc] = useState('');
      const [srvPreco, setSrvPreco] = useState('');
      const [srvTempo, setSrvTempo] = useState('');

      // Prof form
      const [profNome, setProfNome] = useState('');
      const [profEsp, setProfEsp] = useState('');
      const [profCom, setProfCom] = useState('');
      const [profTel, setProfTel] = useState('');

      const handleCliSubmit = (e) => {
        e.preventDefault();
        if (!cliNome || !cliTel) return;
        onAddCliente({ nome: cliNome, telefone: cliTel, email: cliMail, observacoes: cliObs });
        setCliNome(''); setCliTel(''); setCliMail(''); setCliObs('');
      };

      const handleSrvSubmit = (e) => {
        e.preventDefault();
        if (!srvNome || !srvPreco || !srvTempo) return;
        onAddServico({ nome: srvNome, descricao: srvDesc, preco: parseFloat(srvPreco), tempoEstimado: parseInt(srvTempo) });
        setSrvNome(''); setSrvDesc(''); setSrvPreco(''); setSrvTempo('');
      };

      const handleProfSubmit = (e) => {
        e.preventDefault();
        if (!profNome || !profCom) return;
        onAddProfissional({ nome: profNome, especialidade: profEsp, comissaoPercentual: parseFloat(profCom), telefone: profTel });
        setProfNome(''); setProfEsp(''); setProfCom(''); setProfTel('');
      };

      // Recupere histórico de agendamentos d'um cliente
      const clientHistory = useMemo(() => {
        if (!clinId) return [];
        return agendamentos.filter(a => a.clienteId === clinId).sort((x, y) => y.data.localeCompare(x.data));
      }, [agendamentos, clinId]);

      const clientSummary = useMemo(() => {
        if (!clinId) return null;
        return clientes.find(c => c.id === clinId);
      }, [clientes, clinId]);

        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 text-xs font-sans">

                <button onClick={() => { setLocalTab('cli'); setClinId(null); setDeleteConfirmId(null); }} className={`px-4 py-2 font-black rounded-lg transition ${localTab === 'cli' ? 'bg-indigo-600 text-white' : 'text-slate-500 hover:text-slate-800'}`}>Clientes ({clientes.length})</button>
                <button onClick={() => { setLocalTab('srv'); setClinId(null); setDeleteConfirmId(null); }} className={`px-4 py-2 font-black rounded-lg transition ${localTab === 'srv' ? 'bg-indigo-600 text-white' : 'text-slate-500 hover:text-slate-800'}`}>Procedimentos ({servicos.length})</button>
                <button onClick={() => { setLocalTab('prof'); setClinId(null); setDeleteConfirmId(null); }} className={`px-4 py-2 font-black rounded-lg transition ${localTab === 'prof' ? 'bg-indigo-600 text-white' : 'text-slate-500 hover:text-slate-800'}`}>Esteticistas ({profissionais.length})</button>
              </div>

              {localTab === 'cli' && (
                <div className="space-y-3.5">
                  {clientes.map(c => (
                    <div key={c.id} className="p-3 border border-slate-50 hover:bg-slate-50/60 rounded-xl flex items-center justify-between text-xs transition">

                        <span className="font-bold text-slate-800 text-[13px] block">{c.nome}</span>
                        <div className="text-slate-400 flex flex-wrap gap-2 text-[10px]">
                          <span>📱 {c.telefone}</span>
                          <span>|</span>

                      <div className="flex items-center gap-1 shrink-0">

                        {deleteConfirmId === c.id ? (

                  ))}
                </div>
              )}
            </div>
          </div>

          <div className="lg:col-span-4 space-y-4">
            {/* Timeline modal inline panel */}
            {clinId && clientSummary && (
              <div className="p-5 bg-white border border-indigo-100 rounded-2xl shadow-xs space-y-4 animate-fade-in font-sans text-xs">
                <div className="flex justify-between items-center pb-2 border-b border-indigo-100">
                  <h3 className="font-extrabold text-slate-800 uppercase">Evolução de {clientSummary.nome}</h3>
                  <button onClick={() => setClinId(null)} className="p-1 hover:bg-slate-100 rounded text-slate-400"><Icon name="X" /></button>
                </div>

                <div className="space-y-1 bg-indigo-50/20 p-2.5 rounded-xl border border-indigo-100/40 text-[11px] text-indigo-950">
                  <span className="font-extrabold text-indigo-900 block mb-0.5">Ficha Clínica Rápida</span>
                  <p>Notas Médicas: {clientSummary.observacoes || 'Nenhuma alergia relatada pelo parceiro estético.'}</p>
                </div>

                {clientHistory.length === 0 ? (
                  <p className="text-center text-slate-400 py-4">Nenhum atendimento realizado até o momento.</p>
                ) : (
                  <div className="space-y-3.5 pl-3 border-l-2 border-indigo-100 text-xs">
                    {clientHistory.map(h => {
                      const sName = servicos.find(s => s.id === h.servicoId)?.nome || 'Serviço';
                      return (
                        <div key={h.id} className="relative space-y-0.5">
                          <span className="absolute -left-[17px] top-[4px] w-2.5 h-2.5 rounded-full bg-indigo-600 ring-4 ring-white"></span>
                          <span className="font-mono text-[10px] text-slate-400 block font-semibold">{h.data} • {h.hora}</span>
                          <span className="font-bold text-slate-800 block">{sName}</span>
                          <div className="flex items-center gap-2">
                            <span className="font-semibold text-slate-700">R$ {h.valorCobrado.toFixed(2)}</span>
                            <span className={`px-1.5 py-0.5 rounded text-[8px] font-bold ${h.status === 'Realizado e Pago' ? 'bg-emerald-50 text-emerald-800' : h.status === 'Cancelado' ? 'bg-slate-100 text-slate-400' : 'bg-amber-50 text-amber-700'}`}>{h.status}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* Creation context forms */}
            {localTab === 'cli' && (
              <form onSubmit={handleCliSubmit} className="p-5 bg-white border border-slate-100 rounded-2xl shadow-xs space-y-3 animate-fade-in">
                <h3 className="font-black text-slate-800 uppercase border-b pb-2 mb-2 flex items-center gap-1"><Icon name="Plus"/> Lançar Cliente</h3>
                <div className="space-y-1">
                  <label className="block text-slate-500 font-bold">Nome Completo*</label>
                  <input type="text" value={cliNome} onChange={(e) => setCliNome(e.target.value)} placeholder="Paula Albuquerque" required className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                </div>
                <div className="space-y-1">
                  <label className="block text-slate-500 font-bold">Telefone de Contato*</label>
                  <input type="text" value={cliTel} onChange={(e) => setCliTel(e.target.value)} placeholder="(11) 98765-4321" required className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                </div>
                <div className="space-y-1">
                  <label className="block text-slate-500 font-bold">WhatsApp / Endereço Eletrônico</label>
                  <input type="email" value={cliMail} onChange={(e) => setCliMail(e.target.value)} placeholder="paula@gmail.com" className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                </div>
                <div className="space-y-1">
                  <label className="block text-slate-500 font-bold">Restrições / Nota Clínica</label>
                  <textarea value={cliObs} onChange={(e) => setCliObs(e.target.value)} placeholder="Alergia a ácido salicílico..." className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50 h-16 resize-none" />
                </div>
                <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition">Cadastrar</button>
              </form>
            )}

            {localTab === 'srv' && (
              <form onSubmit={handleSrvSubmit} className="p-5 bg-white border border-slate-100 rounded-2xl shadow-xs space-y-3 animate-fade-in">
                <h3 className="font-black text-slate-800 uppercase border-b pb-2 mb-2 flex items-center gap-1"><Icon name="Plus"/> Lançar Procedimento</h3>
                <div className="space-y-1">
                  <label className="block text-slate-500 font-bold">Nome do Tratamento*</label>
                  <input type="text" value={srvNome} onChange={(e) => setSrvNome(e.target.value)} placeholder="Peeling de Porcelana" required className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                </div>
                <div className="space-y-1">
                  <label className="block text-slate-500 font-bold">Apresentação / Descrição</label>
                  <input type="text" value={srvDesc} onChange={(e) => setSrvDesc(e.target.value)} placeholder="Máscara revitalizadora de argila branca e colágeno" className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="space-y-1">
                    <label className="block text-slate-500 font-bold">Preço de Tabela (R$)*</label>
                    <input type="number" step="0.01" value={srvPreco} onChange={(e) => setSrvPreco(e.target.value)} required className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                  </div>
                  <div className="space-y-1">
                    <label className="block text-slate-500 font-bold">Tempo (min)*</label>
                    <input type="number" value={srvTempo} onChange={(e) => setSrvTempo(e.target.value)} required className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                  </div>
                </div>
                <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition">Catalogar Serviço</button>
              </form>
            )}

            {localTab === 'prof' && (
              <form onSubmit={handleProfSubmit} className="p-5 bg-white border border-slate-100 rounded-2xl shadow-xs space-y-3 animate-fade-in">
                <h3 className="font-black text-slate-800 uppercase border-b pb-2 mb-2 flex items-center gap-1"><Icon name="Plus"/> Nova Esteticista</h3>
                <div className="space-y-1">
                  <label className="block text-slate-500 font-bold">Nome Completo*</label>
                  <input type="text" value={profNome} onChange={(e) => setProfNome(e.target.value)} placeholder="Roberta Silva" required className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                </div>
                <div className="space-y-1">
                  <label className="block text-slate-500 font-bold">Especialidade / Foco</label>
                  <input type="text" value={profEsp} onChange={(e) => setProfEsp(e.target.value)} placeholder="Lipo sem cortes e drenagens avançadas" className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div className="space-y-1">
                    <label className="block text-slate-500 font-bold">Comissão (%)*</label>
                    <input type="number" value={profCom} onChange={(e) => setProfCom(e.target.value)} placeholder="40" required className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                  </div>
                  <div className="space-y-1">
                    <label className="block text-slate-500 font-bold">Telefone*</label>
                    <input type="text" value={profTel} onChange={(e) => setProfTel(e.target.value)} placeholder="(11) 91122-3344" className="w-full p-2 border border-slate-200 rounded-xl focus:outline-indigo-600 bg-slate-50" />
                  </div>
                </div>
                <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold transition">Cadastrar Membro</button>
              </form>
            )}
          </div>
        </div>
      );
    }

    // --- SUBVIEW 5: DOCUMENTACAO BD ACCORDION TAB ---
    function DocumentacaoTab() {
      const [activeSec, setActiveSec] = useState('rf');
      return (
        <div className="bg-white border border-slate-100 rounded-2xl shadow-xs overflow-hidden leading-relaxed text-slate-700 text-xs font-sans">
          <div className="p-5 border-b bg-slate-50/50 flex items-center gap-2">
            <Icon name="Database" className="w-5 h-5 text-indigo-500" />
            <div>
              <h2 className="font-extrabold text-slate-900 text-sm">Estruturas Contábeis e Modelagem SQL</h2>
              <p className="text-[10px] text-slate-400 mt-0.5">Auditoria e regras de integridade relacional do Atelier Estética</p>
            </div>
          </div>

          <div className="flex border-b border-slate-100 bg-slate-50/20 text-center font-bold">
            <button onClick={() => setActiveSec('rf')} className={`flex-1 py-3 transition ${activeSec === 'rf' ? 'bg-white text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'}`}>Regras Funcionais</button>
            <button onClick={() => setActiveSec('db')} className={`flex-1 py-3 transition ${activeSec === 'db' ? 'bg-white text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'}`}>Dicionário ER</button>
            <button onClick={() => setActiveSec('sql')} className={`flex-1 py-3 transition ${activeSec === 'sql' ? 'bg-white text-indigo-600 border-b-2 border-indigo-600' : 'text-slate-500 hover:text-slate-800'}`}>Código Código SQL DDL</button>
          </div>

          <div className="p-5 md:p-6 space-y-4">
            {activeSec === 'rf' && (
              <div className="space-y-3.5">
                <span className="text-[10px] uppercase font-bold text-indigo-600 tracking-wider">Regras de Negócio Implementadas</span>
                <p>O fluxo baseia-se em <strong>Sincronização Dupla de Caixa</strong>:</p>
                <ol className="list-decimal pl-4 space-y-2 text-slate-600 text-[11px]">
                  <li>Quando um agendamento é marcado como feito e pago, registra-se uma <strong>Entrada</strong> de faturamento síncrona.</li>
                  <li>Paralelamente, o sistema calcula a comissão correspondente e deduz uma <strong>Saída por Comissão</strong> com link direto ao agendamento associado.</li>
                  <li>Isso protege a saúde financeira, prevenindo divergências físicas de tesouro no final do mês.</li>
                </ol>
              </div>
            )}

            {activeSec === 'db' && (
              <div className="space-y-3.5">
                <span className="text-[10px] uppercase font-bold text-indigo-600 tracking-wider">Mapeamento Físico de Chaves de Enlace</span>
                <div className="overflow-x-auto border border-slate-100 rounded-xl">
                  <table className="w-full text-left text-[11px] border-collapse">
                    <thead>
                      <tr className="bg-slate-50 text-slate-700 font-bold border-b border-slate-100"><th className="p-2.5">Entidade</th><th className="p-2.5">Chave</th><th className="p-2.5">Vinculo</th><th className="p-2.5">Regra DDL</th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 text-slate-500">
                      <tr><td className="p-2.5 font-bold text-slate-800">agendamentos</td><td className="p-2.5">cliente_id</td><td className="p-2.5">clientes(id)</td><td className="p-2.5">ON DELETE SET NULL</td></tr>
                      <tr><td className="p-2.5 font-bold text-slate-800">agendamentos</td><td className="p-2.5">profissional_id</td><td className="p-2.5">profissionais(id)</td><td className="p-2.5">ON DELETE RESTRICT</td></tr>
                      <tr><td className="p-2.5 font-bold text-slate-800">transacoes</td><td className="p-2.5">agendamento_id</td><td className="p-2.5">agendamentos(id)</td><td className="p-2.5">ON DELETE CASCADE</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeSec === 'sql' && (
              <pre className="p-4 bg-slate-950 text-slate-300 font-mono text-[10px] overflow-x-auto rounded-xl max-w-full leading-5">
{`-- DDL Ideal para PostgreSQL / SQLite e MySQL
CREATE TABLE clientes (
  id VARCHAR(36) PRIMARY KEY,
  nome VARCHAR(100) NOT NULL,
  telefone VARCHAR(20) NOT NULL,
  email VARCHAR(100),
  observacoes TEXT,
  data_cadastro DATE DEFAULT CURRENT_DATE
);

CREATE TABLE servicos (
  id VARCHAR(36) PRIMARY KEY,
  nome VARCHAR(100) NOT NULL,
  preco DECIMAL(10,2) NOT NULL,
  tempo_estimado INT NOT NULL
);

CREATE TABLE profissionais (
  id VARCHAR(36) PRIMARY KEY,
  nome VARCHAR(100) NOT NULL,
  comissao_percentual DECIMAL(5,2) NOT NULL CHECK(comissao_percentual > 0)
);`}
              </pre>
            )}
          </div>
        </div>
      );
    }

    // Render client context
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
